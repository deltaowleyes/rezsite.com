<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="160" height="140" role="img" aria-label="RezSite emblem: three community figures under a sunrise, green hills and pines, a turquoise river, an earth-brown canoe and a turquoise beaded flower">
  <!-- sunrise arch -->
  <path d="M28 70 A52 52 0 0 1 132 70" fill="none" stroke="#C44512" stroke-width="6" stroke-linecap="round"/>
  <path d="M36 70 A44 44 0 0 1 124 70" fill="none" stroke="#B87333" stroke-width="1.6" stroke-linecap="round"/>
  <!-- three community figures -->
  <g stroke="#F7F1E6" stroke-width="1.4">
    <circle cx="57" cy="35" r="7.5" fill="#004F45"/>
    <path d="M43 61 Q57 40 71 61 Z" fill="#004F45"/>
    <circle cx="103" cy="35" r="7.5" fill="#1FB5B5"/>
    <path d="M89 61 Q103 40 117 61 Z" fill="#1FB5B5"/>
    <circle cx="80" cy="27" r="8.5" fill="#C44512"/>
    <path d="M64 57 Q80 33 96 57 Z" fill="#C44512"/>
  </g>
  <!-- hills -->
  <path d="M8 98 L46 64 L66 78 L82 66 L102 80 L120 64 L152 98 Z" fill="#0E6B5C"/>
  <path d="M8 98 L40 70 L62 88 L84 72 L112 90 L130 74 L152 98 Z" fill="#004F45"/>
  <!-- pines -->
  <g fill="#003D35" stroke="#F7F1E6" stroke-width=".8" stroke-linejoin="round">
    <path d="M22 86 L28 66 L34 86 Z"/><path d="M23.5 78 L28 60 L32.5 78 Z"/>
    <path d="M126 86 L132 66 L138 86 Z"/><path d="M127.5 78 L132 60 L136.5 78 Z"/>
    <path d="M14 92 L18.5 78 L23 92 Z"/><path d="M137 92 L141.5 78 L146 92 Z"/>
  </g>
  <!-- winding river -->
  <path d="M84 66 C 72 74 96 78 80 86 C 66 93 98 96 112 100" fill="none" stroke="#1FB5B5" stroke-width="7" stroke-linecap="round"/>
  <path d="M84 66 C 72 74 96 78 80 86 C 66 93 98 96 112 100" fill="none" stroke="#F7F1E6" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/>
  <!-- water under the canoe -->
  <path d="M10 100 Q80 92 150 100 L150 107 Q80 99 10 107 Z" fill="#1FB5B5"/>
  <!-- canoe -->
  <path d="M24 90 Q30 99 42 101 L118 101 Q130 99 136 90 Q132 113 80 116 Q28 113 24 90 Z" fill="#5B483F" stroke="#B87333" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M30 100 Q80 110 130 100" fill="none" stroke="#F7F1E6" stroke-width="1" opacity=".55"/>
  <g fill="#F7F1E6" stroke="#B87333" stroke-width=".6">
    <path d="M62 106 l4 -3.5 l4 3.5 l-4 3.5 Z"/><path d="M72 106.5 l4 -3.5 l4 3.5 l-4 3.5 Z"/>
    <path d="M82 106.5 l4 -3.5 l4 3.5 l-4 3.5 Z"/><path d="M92 106 l4 -3.5 l4 3.5 l-4 3.5 Z"/>
  </g>
  <!-- paddle -->
  <path d="M52 82 L94 110" stroke="#D9A066" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M49 80 L55 84" stroke="#B87333" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="99" cy="113.5" rx="3.6" ry="9" transform="rotate(-56 99 113.5)" fill="#D9A066" stroke="#B87333" stroke-width="1.2"/>
  <!-- leaves and berries -->
  <g stroke="#004F45" stroke-width="1.3" stroke-linejoin="round">
    <path d="M70 127 Q54 116 40 124 Q54 133 70 127 Z" fill="#5E9B3C"/>
    <path d="M90 127 Q106 116 120 124 Q106 133 90 127 Z" fill="#5E9B3C"/>
  </g>
  <g fill="#C44512" stroke="#7A2A0A" stroke-width=".6">
    <circle cx="36" cy="121" r="2.8"/><circle cx="34" cy="128" r="2.4"/>
    <circle cx="124" cy="121" r="2.8"/><circle cx="126" cy="128" r="2.4"/>
  </g>
  <!-- five-petal beaded flower -->
  <g transform="translate(80 125)" fill="#1FB5B5" stroke="#004F45" stroke-width="1.5">
    <ellipse cx="0" cy="-7.5" rx="5.6" ry="7.6"/>
    <ellipse cx="0" cy="-7.5" rx="5.6" ry="7.6" transform="rotate(72)"/>
    <ellipse cx="0" cy="-7.5" rx="5.6" ry="7.6" transform="rotate(144)"/>
    <ellipse cx="0" cy="-7.5" rx="5.6" ry="7.6" transform="rotate(216)"/>
    <ellipse cx="0" cy="-7.5" rx="5.6" ry="7.6" transform="rotate(288)"/>
    <circle r="4.2" fill="#F2B632" stroke="#B87333" stroke-width="1"/>
  </g>
</svg>
